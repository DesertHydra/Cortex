# The latest versions are available at https://fabricmc.net/develop/
[versions]
minecraft = "26.2"
java = "25"

fabric_loom = "1.18.2" # https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/
fabric_loader = "0.19.5"

fabric_api = "0.161.0+26.2"

jei = "30.32.0.222"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }

fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }

jei_fabric_api = { module = "mezz.jei:jei-26.2-fabric-api", version.ref = "jei" }
jei_fabric = { module = "mezz.jei:jei-26.2-fabric", version.ref = "jei" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]

[plugins]
fabric_loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric_loom" }
