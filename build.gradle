plugins {
	id 'maven-publish'
	alias libs.plugins.fabric.loom
}

base {
	archivesName = project.archives_base_name
}

version = "$project.version+${libs.versions.minecraft.get()}"

repositories {
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com"
			}
		}
		filter {
			includeGroup("mezz.jei")
		}
	}
}

// All the dependencies are declared at gradle/libs.version.toml and referenced with "libs.<id>"
// See https://docs.gradle.org/current/userguide/platforms.html for information on how version catalogs work.
dependencies {
	minecraft libs.minecraft
	implementation libs.fabric.loader

	implementation libs.fabric.api

	localRuntime libs.jei.fabric
}

fabricApi {
	configureDataGeneration() {
		client = true
		modId = "cortex"
		strictValidation = true
	}
}

loom {
	mods {
		"cortex" {
			sourceSet("main")
		}
	}

	accessWidenerPath = file("src/main/resources/cortex.classtweaker")

	runs {
		configureEach {
			preferGradleTask = true
		}
	}
}

processResources {
	def expandProps = [
	    "version": version
	]

	inputs.properties expandProps

	filesMatching('fabric.mod.json') {
		expand expandProps
	}

	// It would be super confusing if the lang/README was on the JAR file
	exclude("assets/cortex/lang/README.md")
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
	// Uncomment this line to generate them.
	// withJavadocJar()
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
	from("LICENSE") {
		rename("LICENSE", "LICENSE_${project.name}")
	}
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
